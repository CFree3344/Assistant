[project]
name = "meme-terminal"
version = "0.1.0"
description = "Dry-run Solana memecoin paper-trading terminal. No wallets, no signing, no orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
meme-terminal = "meme_terminal.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
